<body>
  <h1>Completing Healow authorization</h1>
  <div class="card"><p>Returning securely to the local Personal Health Data Viewer…</p></div>

    // The code exchange is intentionally performed by the localhost helper,
    // not from this public GitHub Pages origin, because Healow's token endpoint
    // does not allow browser CORS requests from GitHub Pages.
    location.replace('http://127.0.0.1:8765/callback' + location.search);
  </script>
